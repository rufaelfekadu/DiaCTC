[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diactc"
version = "0.1.0"
description = "Constrained CTC/WFST decoding for automatic Arabic diacritization with Wav2Vec2"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers>=4.57.6",
    "soundfile==0.13.1",
    "librosa>=0.11.0",
    "pyarabic>=0.6.10",
    "datasets>=2.0.0,<4.0.0",
    "jiwer>=3.0.0",
    "tqdm>=4.65.0",
    "numpy<2.0.0",
    "evaluate>=0.4.6",
    "accelerate>=1.1.0",
    "pandas>=2.0.0",
    "tensorboard>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.0.285",
]
notebooks = [
    "jupyter",
    "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
